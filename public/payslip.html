<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payslip</title>
<link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E9ECF2;color:#1D1D1B;font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 14px 40px}
.paper{background:#fff;border-radius:14px;padding:34px 30px 28px;box-shadow:0 1px 3px rgba(18,32,58,.12)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:20px;border-bottom:2px solid #1D1D1B}
.top img{height:42px;width:auto;display:block}
.ttl{text-align:right}.ttl b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5E6B82}.ttl span{font-size:20px;font-weight:700}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:20px 0}
.meta small{display:block;color:#5E6B82;font-size:12px}.meta b{font-weight:700}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5E6B82;margin:22px 0 4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #E1E6EF}
.row small{display:block;color:#5E6B82;font-size:12.5px}.row span:last-child{white-space:nowrap}
.net{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding:16px 18px;background:#1D1D1B;color:#fff;border-radius:12px}
.net span{font-size:13px;letter-spacing:.1em;text-transform:uppercase}.net b{font-size:26px;letter-spacing:-.5px}
.foot{margin-top:18px;color:#5E6B82;font-size:12.5px}
.act{display:flex;gap:10px;margin-top:16px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;background:#2B59FF;color:#fff;cursor:pointer}
button.alt{background:#fff;color:#1D1D1B;border:1px solid #CBD3E1}
.msg{padding:40px 10px;text-align:center;color:#5E6B82}
@page{size:A4;margin:16mm}
@media print{body{background:#fff}.wrap{padding:0;max-width:none}.paper{box-shadow:none;border-radius:0;padding:0}.act{display:none}.net{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><div class="wrap" id="w"><div class="msg">Loading…</div></div>
<script>
const L=localStorage,m=new URLSearchParams(location.search).get('m')||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const fail=t=>{document.getElementById('w').innerHTML=`<div class="msg">${t}<br><br><a href="/">Back to the app</a></div>`};
fetch('/api/payslips',{headers:{'x-user':L.getItem('u')||'','x-pin':L.getItem('p')||''}})
.then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{
  const s=j.slips.find(x=>x.month===m);
  if(!s)return fail('This payslip is not available yet.');
  const period=new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const issued=new Date(s.at).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'});
  const line=x=>`<div class="row"><span>${esc(x.l)}${x.n?`<small>${esc(x.n)}</small>`:''}</span><span>${R(x.a)}</span></div>`;
  const att=`Worked ${s.aDays} of ${s.sDays} scheduled days`+(s.leaveDays?` · ${s.leaveDays} annual leave day${s.leaveDays>1?'s':''} (paid)`:'')+(s.lateDays?` · ${s.lateDays} late clock-in${s.lateDays>1?'s':''}`:'');
  document.title='Payslip '+period;
  document.getElementById('w').innerHTML=`<div class="paper">
    <div class="top"><img src="/img/kurogi.png" alt="Kurogi"><div class="ttl"><b>Payslip</b><span>${esc(period)}</span></div></div>
    <div class="meta"><div><small>Employee</small><b>${esc(s.name)}</b></div><div><small>Pay type</small><b>${s.type==='hourly'?'Hourly':'Monthly'}</b></div><div><small>Period</small><b>${esc(period)}</b></div><div><small>Issued</small><b>${esc(issued)}</b></div></div>
    <h2>Earnings</h2>${s.earnings.map(line).join('')}
    <h2>Deductions</h2>${s.deductions.length?s.deductions.map(line).join(''):'<div class="row"><span>None</span><span>-</span></div>'}
    <div class="net"><span>Take-home pay</span><b>${R(s.net)}</b></div>
    <div class="foot">${esc(att)}</div></div>
    <div class="act"><button onclick="print()">Print / save as PDF</button><button class="alt" onclick="history.length>1?history.back():location.href='/'">Back</button></div>`;
}).catch(()=>fail('Please open the app and sign in first.'));
</script></body></html>
