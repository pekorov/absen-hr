<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>Slip Gaji · Kurogi</title>
<link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Shippori+Mincho:wght@800&display=swap">
<script src="/slip-pdf.js"></script>
<style>
:root{--paper:#F6F1E7;--card:#FFFDF8;--ink:#2B2A24;--mute:#7B7666;--line:#E4DCCB;--matcha:#4E6B3A;--on-matcha:#FFFDF8;--bad:#8E2A1E}
@media(prefers-color-scheme:dark){:root{--paper:#1B1D18;--card:#24271F;--ink:#EEE9DC;--mute:#A8A290;--line:#363A2E;--matcha:#8DB36E;--on-matcha:#17190F;--bad:#F2A496;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(36px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.paper{background:#FFFDF8;color:#2B2A24;border-radius:6px;padding:24px 20px 18px;box-shadow:0 8px 24px rgba(0,0,0,.1);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:1.5px solid #2B2A24}
.top img{height:34px;display:block}.ttl{text-align:right}.ttl b{display:block;font-size:10.5px;letter-spacing:.16em;color:#7B7666}.ttl span{font:800 18px/1.3 'Shippori Mincho',Georgia,serif}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0}.meta small,.row small{display:block;color:#7B7666;font-size:11.5px}
h4{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7B7666;margin:16px 0 2px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #E4DCCB}.row span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.net{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding:13px 15px;background:#4E6B3A;color:#FFFDF8;border-radius:4px}.net span{font-size:11px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}.net b{font-size:21px;font-variant-numeric:tabular-nums}
.foot{color:#7B7666;font-size:12px;margin:12px 0 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:13px 18px;cursor:pointer}
.btn.p{background:var(--matcha);border-color:var(--matcha);color:var(--on-matcha)}
.note{color:var(--mute);font-size:13px;text-align:center}
.err{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--bad);font-weight:600}
.logo{width:110px;aspect-ratio:723/270;background:var(--ink);-webkit-mask:url(/img/kurogi.png) center/contain no-repeat;mask:url(/img/kurogi.png) center/contain no-repeat;margin:4px auto 6px}
[hidden]{display:none!important}
</style></head><body><div class="app">
<div class="note" id="load">Memuat slip gaji…</div>
<div id="err" hidden><div class="logo" role="img" aria-label="Kurogi"></div><div class="err" id="errt"></div></div>
<div id="ok" hidden style="display:flex;flex-direction:column;gap:12px">
  <div id="slip"></div>
  <button class="btn p" id="dl">Unduh PDF</button>
  <button class="btn" id="sh" hidden>Bagikan / simpan PDF</button>
  <div class="note" id="exp"></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rpf=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
(async()=>{
  const k=new URLSearchParams(location.search).get('k')||'';
  const r=await fetch('/api/slip?k='+encodeURIComponent(k)).catch(()=>null);
  const j=r?await r.json().catch(()=>({})):{error:'Tidak bisa terhubung. Periksa internet Anda dan coba lagi.'};
  $('#load').hidden=true;
  if(!r||!r.ok){$('#err').hidden=false;$('#errt').textContent=j.error||'Link tidak berlaku.';return}
  const s=j,m=slipMeta(s),line=x=>`<div class="row"><span>${esc(x.l)}${x.n?`<small>${esc(x.n)}</small>`:''}</span><span>${rpf(x.a)}</span></div>`;
  $('#slip').innerHTML=`<article class="paper"><div class="top"><img src="/img/kurogi.png" alt="Kurogi"><div class="ttl"><b>SLIP GAJI</b><span>${esc(m.period)}</span></div></div>
  <div class="meta"><div><small>Nama karyawan</small><b>${esc(s.name)}</b></div><div><small>Jenis gaji</small><b>${PTYPE_ID[s.type]||esc(s.type)}</b></div><div><small>Periode</small><b>${esc(m.period)}</b></div><div><small>Tanggal terbit</small><b>${esc(m.issued)}</b></div></div>
  <h4>Pendapatan</h4>${s.earnings.map(line).join('')}<h4>Potongan</h4>${s.deductions.length?s.deductions.map(line).join(''):'<div class="row"><span>Tidak ada</span><span>-</span></div>'}
  <div class="net"><span>Gaji bersih diterima</span><b>${rpf(s.net)}</b></div><p class="foot">${esc(m.att)}<br><b>${esc(verLine(s.ver))}</b></p></article>`;
  $('#exp').textContent=`Link ini pribadi. Jangan dibagikan ke orang lain. Berlaku sampai ${idLong(s.shareUntil)}.`;
  $('#ok').hidden=false;
  const file=()=>slipPdf({s});
  $('#dl').onclick=async()=>{const f=await file(),u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)};
  if(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.pdf',{type:'application/pdf'})]})){$('#sh').hidden=false;$('#sh').onclick=async()=>{try{await navigator.share({files:[await file()]})}catch(e){}}}
})();
</script></body></html>
