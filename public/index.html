.go:disabled{background:var(--soft);color:var(--mute);box-shadow:none;font-size:18px}

      <img id="stk" hidden alt="">
    </div>

  </div>
  <div><div class="eyebrow" style="margin:0 0 8px" data-t>Next 7 days</div><div class="week" id="week"></div></div>
  <div class="row2"><button class="btn" id="swb" data-t>Swap a shift</button><button class="btn" id="lvb" data-t>Request leave</button></div>

  <div class="card" id="swf" hidden>
    <h2 data-t>Swap a shift</h2>
    <div class="sub" id="swlead"></div>
    <label class="f" for="sd" data-t>Your shift</label><select id="sd"></select>
    <label class="f" for="sw" data-t>Swap with</label><select id="sw"></select>
    <label class="f" for="so2" data-t>What happens</label><select id="so2"></select>
    <label class="f" for="sn" data-t>Note (optional)</label><input id="sn" maxlength="120" placeholder="e.g. family event" data-tp>
    <div class="msg bad" id="swm" style="margin:10px auto 0"></div>
    <div class="row2" style="margin-top:6px"><button class="btn" id="swx" data-t>Close</button><button class="btn p" id="sws" data-t>Send request</button></div>
  </div>

  <div class="card" id="lvf" hidden>
    <h2 data-t>Request annual leave</h2>
    <div class="sub" data-t>Your manager approves it. Approved leave is paid.</div>
    <label class="f" for="lf" data-t>From</label><input type="date" id="lf">
    <label class="f" for="lt" data-t>To</label><input type="date" id="lt">
    <label class="f" for="ln" data-t>Note (optional)</label><input id="ln" maxlength="120">
    <div class="msg bad" id="lvm" style="margin:10px auto 0"></div>
    <div class="row2" style="margin-top:6px"><button class="btn" id="lvx" data-t>Close</button><button class="btn p" id="lvs" data-t>Send request</button></div>
  </div>

  <div class="card" id="reqs" hidden><h2 data-t>My requests</h2><div id="reql"></div></div>
  <div class="foot" data-t>A selfie is taken when you clock in. Your location is checked at clock-in and clock-out.</div>
</div>
</div>
<div id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="in"><h2 id="dlgt" style="margin:0"></h2><p id="dlgm"></p><div class="row2"><button class="btn" id="dlgno"></button><button class="btn r" id="dlgyes"></button></div></div></div>
<div id="cm" hidden><div id="cmt"></div><video id="vid" autoplay playsinline muted></video><div class="cbar"><button class="btn" id="cc" data-t>Cancel</button><button class="btn p" id="snap" data-t>Take photo</button></div></div>

const t=(s,v={})=>Object.entries(v).reduce((a,[k,x])=>a.split('{'+k+'}').join(x),LANG==='id'&&ID[s]?ID[s]:s);
const LOC=()=>LANG==='id'?'id-ID':'en-GB';
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{el.dataset.en=el.dataset.en||el.textContent;el.textContent=t(el.dataset.en)});
  document.querySelectorAll('[data-tp]').forEach(el=>{el.dataset.en=el.dataset.en||el.placeholder;el.placeholder=t(el.dataset.en)});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{L.setItem('lang',LANG)}catch(e){}applyLang();if(!$('#main').hidden)load();});
const cap=s=>String(s||'').replace(/(^|\s)\S/g,c=>c.toUpperCase());
const slug=n=>n.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
// Signed out after 5 hours without using the page (checked on this phone).
const IDLE=5*3600e3;
const touch=()=>{try{L.setItem('act',Date.now())}catch(e){}};
function idleOut(){
  const u=L.getItem('u'),act=Number(L.getItem('act')||0);
  if(!u)return false;
  if(!act){touch();return false} // signed in before this update: start the clock now
  if(Date.now()-act<=IDLE)return false;
  L.removeItem('u');L.removeItem('p');L.removeItem('act');
  $('#main').hidden=true;$('#so').hidden=true;$('#login').hidden=false;$('#lm').textContent=t('Signed out after 5 hours without activity. Please sign in again.');
  return true;
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(L.getItem('u')&&!idleOut())touch()},{passive:true,capture:true}));
setInterval(idleOut,60e3);
const hdr=()=>({'content-type':'application/json','x-lang':LANG,'x-user':L.getItem('u')||'','x-pin':L.getItem('p')||''});
const api=(p,b)=>fetch(p,b?{method:'POST',headers:hdr(),body:JSON.stringify(b)}:{headers:hdr()}).then(async r=>({ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))}));
const WHY={outside_office:'you were outside the restaurant area',low_accuracy:'GPS was not accurate',impossible_travel:'location jumped too far',no_location:'location was blocked',no_selfie:'no selfie was taken',no_shift_today:'no shift is scheduled today',no_qr:'the counter QR code was not scanned',same_photo:'the same photo was used before',similar_photo:'the photo looks the same as an earlier one',similar_other:"the photo looks the same as a colleague's"};

// QR code from the counter tablet: arrives in the link (?qr=...) or from the in-page scanner. Valid for 2 minutes.
let qr='',qrAt=0;
(()=>{const q=new URLSearchParams(location.search).get('qr');if(q){qr=q;qrAt=Date.now();history.replaceState(null,'',location.pathname)}})();
const qrNow=()=>Date.now()-qrAt<110000?qr:'';

let locErr='';
function getPos(){
  return new Promise(res=>{
    if(!navigator.geolocation){locErr='unsupported';return res(null)}
    const go=(hi,next)=>navigator.geolocation.getCurrentPosition(p=>{locErr='';res(p.coords)},e=>{
      if(e.code===1){locErr='denied';res(null)}else if(next)next();else{locErr=e.code===3?'timeout':'unavailable';res(null)}
    },{enableHighAccuracy:hi,timeout:10000,maximumAge:0});
    go(true,()=>go(false,null));
  });
}
const TIP={denied:'Allow location for this site. iPhone: Settings > Privacy & Security > Location Services > Safari Websites > While Using the App. Android: tap the lock icon next to the address > Permissions. Then reload the page.',timeout:'Move near a window or outdoors, make sure Location Services is on, and try again.',unavailable:'Make sure Location Services is on, then try again. If you opened this link inside WhatsApp or another app, open it in Safari or Chrome instead.',unsupported:'This browser cannot share location. Open the link in Safari or Chrome.'};
let open=false,asked=false,me=null,sw=null;
async function askLoc(){const c=await getPos();$('#locb').hidden=!!c;if(!c)$('#loct').textContent=t('Location is off, so you cannot clock in or out yet. ')+t(TIP[locErr||'unavailable']);return c}
function greet(){const h=new Date().getHours();return t(h<11?'Good morning':h<15?'Good afternoon':h<19?'Good evening':'Good night')}

async function load(){
  const r=await api('/api/me');
  if(!r.ok){$('#main').hidden=true;$('#login').hidden=false;$('#so').hidden=true;return false}
  const m=me=r.j;$('#login').hidden=true;$('#main').hidden=false;$('#so').hidden=false;open=m.open;
  $('#greet').textContent=greet();$('#hi').textContent=t('Hi, {n}',{n:cap(m.name.split(' ')[0])});
  const d0=m.week[0],work=d0.code&&d0.code!=='OFF';
  $('#tcode').textContent=d0.leave?t('Annual leave'):work?d0.code:t('Day off');$('#ttime').textContent=work&&!d0.leave?`${d0.start} – ${d0.end}`:t('No shift today');
  $('#tloc').textContent=m.place||'';$('#tloc').hidden=!m.place;
  const done=m.today&&m.today.out&&!m.open;
  const st=$('#state');st.hidden=!(m.open||done);
  if(m.open){st.className='chip ok';st.textContent=t('Clocked in')+(m.today&&m.today.in?' · '+m.today.in:'')}
  else if(done){st.className='chip';st.textContent=t('Done')+' · '+m.today.out}
  const k=done?'thank_u':m.open?'kopi':'',sk=$('#stk');sk.hidden=!k;if(k){sk.src='/img/'+k+'.webp';sk.alt=k==='kopi'?'Hemm... kopi dulu?':'Terima kasih'}
  $('#go').textContent=t(done?'See you tomorrow':m.open?'Clock out':'Clock in');$('#go').disabled=!!done;$('#go').className='go'+(m.open?' out':'');
  $('#week').innerHTML=m.week.map((d,i)=>{const w=d.code&&d.code!=='OFF';return `<div class="day${i?'':' t'}${w||d.leave?'':' off'}"><span>${i?new Date(d.date+'T00:00:00').toLocaleDateString(LOC(),{weekday:'short',day:'numeric'}):t('Today')}</span><b>${d.leave?t('Leave'):w?esc(d.code):d.code?t('OFF'):'–'}</b>${w&&!d.leave?`<small>${d.start}–${d.end}</small>`:''}</div>`}).join('');
  const ub=$('#undo');clearTimeout(ub._t);ub.hidden=!m.undo;
  if(m.undo){const until=new Date(m.undo).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});ub.textContent=t('Undo clock-out (until {t})',{t:until});ub._t=setTimeout(()=>{ub.hidden=true},Math.max(0,m.undo-Date.now()))}
  if(!asked){asked=true;askLoc()}
  loadReqs();
  return true;
}

// ---------- requests: swaps and leave ----------
const ST=s=>t(SST[s][1]);
const SST={waiting:['warn','Waiting for colleague'],accepted:['warn','Waiting for manager'],approved:['ok','Approved'],declined:['bad','Declined'],rejected:['bad','Rejected by manager'],cancelled:['','Cancelled'],expired:['','Expired']};
function swapText(s){
  const you=s.mine,other=cap(you?s.bL:s.aL);
  const o=esc(other),cA=esc(s.cA),cB=esc(s.cB);
  if(s.kind==='give')return you?t('You give your {c} shift on {d} to {o}',{c:cA,d:fmt(s.dA),o}):t('{o} gives you their {c} shift on {d}',{o,c:cA,d:fmt(s.dA)});
  if(s.kind==='same')return t("{d}: you take {o}'s {x}, they take your {y}",{d:fmt(s.dA),o,x:you?cB:cA,y:you?cA:cB});
  return you?t('You give {a} on {d} to {o} and take their {b} on {e}',{a:cA,d:fmt(s.dA),o,b:cB,e:fmt(s.dB)}):t("You take {o}'s {a} on {d} and give them your {b} on {e}",{o,a:cA,d:fmt(s.dA),b:cB,e:fmt(s.dB)});
}
async function loadReqs(){
  const[a,b]=await Promise.all([api('/api/swap'),api('/api/leave')]);
  if(!a.ok)return;sw=a.j;
  const inc=sw.swaps.filter(s=>s.forMe&&s.status==='waiting');
  $('#inbox').hidden=!inc.length;
  $('#inbox').innerHTML=`<h2>${t(inc.length>1?'Swap requests for you':'Swap request for you')}</h2>`+inc.map(s=>`<div class="req"><div>${t('{n} asks:',{n:`<b>${esc(cap(s.aL))}</b>`})}</div><div>${swapText(s)}</div>${s.note?`<div class="sub">“${esc(s.note)}”</div>`:''}<div class="row2"><button class="btn r" data-sd="${s.uid}">${t('Decline')}</button><button class="btn p" data-sa="${s.uid}">${t('Accept')}</button></div><div class="msg bad" id="im-${s.uid}"></div></div>`).join('');
  const mine=sw.swaps.filter(s=>!(s.forMe&&s.status==='waiting')),lv=b.ok?b.j.list:[];
  const items=[...mine.map(s=>({at:s.at,html:`<div class="req"><div class="h"><span>${swapText(s)}</span><span class="chip ${SST[s.status][0]}">${s.status==='waiting'&&s.mine?t('Waiting for {n}',{n:esc(cap(s.bL))}):ST(s.status)}</span></div>${s.mine&&['waiting','accepted'].includes(s.status)?`<div class="row2"><button class="btn" data-sc="${s.uid}">${t('Cancel request')}</button>${s.status==='waiting'?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t('Hi {n}, I sent you a shift swap request in Absen Kurogi: {x}. Please open {u} to accept or decline. Thank you!',{n:cap(s.bL),x:swapText(s).replace(/&#?\w+;/g,''),u:location.origin}))}">${t('Tell on WhatsApp')}</a>`:''}</div>`:''}</div>`})),
    ...lv.map(r=>({at:r.at,html:`<div class="req"><div class="h"><span>${t('Annual leave {d}',{d:r.from===r.to?fmt(r.from):fmt(r.from)+' – '+fmt(r.to)})}</span><span class="chip ${({waiting:'warn',approved:'ok',rejected:'bad'})[r.status]}">${t(({waiting:'Waiting for manager',approved:'Approved',rejected:'Rejected'})[r.status])}</span></div>${r.status==='waiting'?`<div class="row2"><button class="btn" data-lc="${r.uid}">${t('Cancel request')}</button></div>`:''}</div>`}))].sort((x,y)=>y.at-x.at);
  $('#reqs').hidden=!items.length;$('#reql').innerHTML=items.map(x=>x.html).join('');
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-sa],[data-sd],[data-sc],[data-lc]');if(!t)return;
  t.disabled=true;
  let r;
  if(t.dataset.sa)r=await api('/api/swap',{action:'accept',uid:t.dataset.sa});
  else if(t.dataset.sd)r=await api('/api/swap',{action:'decline',uid:t.dataset.sd});

// Swap form
function swapOptions(){
  const dA=$('#sd').value,c=$('#sw').value,o=$('#so2');o.innerHTML='';$('#sws').disabled=true;
  if(!dA||!c||!sw.other)return;
  const mine=Object.fromEntries(sw.days.map(d=>[d.date,d])),theirs=Object.fromEntries(sw.other.map(d=>[d.date,d.code])),myCode=mine[dA].code,off=x=>!x||x==='OFF',opts=[];
  if(off(theirs[dA]))opts.push([`give|`,t('I give my {c} shift to them (they are off that day)',{c:myCode})]);
  else if(theirs[dA]!==myCode)opts.push([`same|${dA}`,t('Same day: I take their {a}, they take my {b}',{a:theirs[dA],b:myCode})]);
  if(off(theirs[dA]))sw.other.forEach(d=>{if(d.date!==dA&&d.date>ymd(new Date())&&!off(d.code)&&mine[d.date]&&off(mine[d.date].code)&&!mine[d.date].leave)opts.push([`trade|${d.date}`,t('I also take their {c} on {d}',{c:d.code,d:fmt(d.date)})])});
  o.innerHTML=opts.length?opts.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join(''):`<option value="">${t('No swap possible with this person on that day')}</option>`;
  $('#sws').disabled=!opts.length;
}

const say=(x,c='')=>{$('#msg').className='msg '+c;$('#msg').textContent=x};
$('#go').onclick=async()=>{
  $('#go').disabled=true;say(t('Checking location…'));$('#qrb').hidden=true;
  const c=await askLoc();
  if(!c){$('#go').disabled=false;say(t(open?'Location not detected, so you cannot clock out.':'Location not detected, so you cannot clock in.'),'bad');return}
  const w=await fetch('/api/where',{method:'POST',headers:hdr(),body:JSON.stringify({type:open?'out':'in',lat:c.latitude,lng:c.longitude,accuracy:c.accuracy,qr:qrNow()})}).then(r=>r.json()).catch(()=>({}));
  if(w.error){$('#go').disabled=false;say(w.error,'bad');if(w.needQr)$('#qrb').hidden=false;return}
  if(open)return doClock(null,c);
  say('');
  const p=await camera('selfie');
  if(p==='denied'){$('#go').disabled=false;say(t('The camera is needed to clock in. Allow camera access in your browser settings.'),'bad');return}
  if(p)doClock(p,c);else $('#go').disabled=false;
};
let jsqr;
function loadJsQR(){return jsqr||(jsqr=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=()=>res(window.jsQR);s.onerror=rej;document.head.appendChild(s)}))}
$('#qrb').onclick=async()=>{
  const code=await camera('qr');
  if(code==='denied'){say(t('Allow camera access to scan the QR code.'),'bad');return}
  if(!code)return;
  const m=String(code).match(/[?&]qr=([^&#\s]+)/);
  if(!m){say(t('That is not the counter QR code. Try again.'),'bad');return}
  qr=decodeURIComponent(m[1]);qrAt=Date.now();$('#qrb').hidden=true;say(t('QR code scanned. Tap Clock in.'),'ok');
};
// Visual fingerprint of the selfie (16x16 difference hash, 256 bits as 64 hex), used to spot re-used photos.
let lastVh='';
function vhash(src){
  const W=17,H=16,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true}),s=Math.min(src.width,src.height);
  x.drawImage(src,(src.width-s)/2,(src.height-s)/2,s,s,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data,g=i=>d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
  let out='',nib=0,n=0;
  for(let y=0;y<H;y++)for(let i=0;i<W-1;i++){nib=(nib<<1)|(g(y*W+i)>g(y*W+i+1)?1:0);if(++n%4===0){out+=nib.toString(16);nib=0}}
  return out;
}
// mode 'selfie': returns a JPEG data URL. mode 'qr': returns the text in the QR code.
async function camera(mode){
  let st,scan=null;
  if(mode==='qr')try{scan=await loadJsQR()}catch(e){say(t('Could not load the QR scanner. Check your internet and try again.'),'bad');return null}
  try{st=await navigator.mediaDevices.getUserMedia({video:mode==='qr'?{facingMode:{ideal:'environment'}}:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false})}catch(e){return 'denied'}
  const v=$('#vid');v.srcObject=st;v.className=mode==='qr'?'':'me';$('#cm').hidden=false;$('#snap').hidden=mode==='qr';
  $('#cmt').textContent=mode==='qr'?t('Point the camera at the QR code on the counter tablet'):'';
  return new Promise(res=>{
    let alive=true;
    const done=r=>{alive=false;st.getTracks().forEach(t=>t.stop());v.srcObject=null;$('#cm').hidden=true;res(r)};
    $('#cc').onclick=()=>done(null);
    if(mode==='qr'){
      const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
      const tick=()=>{if(!alive)return;if(v.videoWidth){const s=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*s|0;c.height=v.videoHeight*s|0;x.drawImage(v,0,0,c.width,c.height);const q=scan(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(q&&q.data)return done(q.data)}requestAnimationFrame(tick)};
      tick();return;
    }
    $('#snap').onclick=()=>{
      if(!v.videoWidth)return;
      const s=400/Math.max(v.videoWidth,v.videoHeight),c=document.createElement('canvas');
      c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      lastVh=vhash(c);
      done(c.toDataURL('image/jpeg',.7));
    };
  });
}
// In-page yes/no question (bigger and clearer than the browser's own popup).
function ask(title,msg,no,yes){
  return new Promise(res=>{
    $('#dlgt').textContent=title;$('#dlgm').textContent=msg;$('#dlgno').textContent=no;$('#dlgyes').textContent=yes;$('#dlg').hidden=false;$('#dlgno').focus();
    const done=v=>{$('#dlg').hidden=true;res(v)};
    $('#dlgno').onclick=()=>done(false);$('#dlgyes').onclick=()=>done(true);
  });
}
const left=m=>m>=60?t('{h} h {m} min',{h:Math.floor(m/60),m:m%60}):t('{m} min',{m});
async function doClock(photo,c,early=false){
  $('#go').disabled=true;say(t('Saving…'));
  const r=await fetch('/api/clock',{method:'POST',headers:hdr(),body:JSON.stringify({type:open?'out':'in',lat:c&&c.latitude,lng:c&&c.longitude,accuracy:c&&c.accuracy,photo,vh:photo?lastVh:undefined,qr:qrNow(),early})});
  const j=await r.json();
  if(r.status===409&&j.early){
    say('');
    const yes=await ask(t('Your shift is not over yet'),t('Your {c} shift ends at {e}, {l} from now. Do you really want to clock out now?',{c:j.code,e:j.end,l:left(j.left)}),t('No, keep working'),t('Yes, clock out'));
    if(yes)return doClock(photo,c,true);
    say(t('Not clocked out. You are still clocked in.'),'ok');$('#go').disabled=false;return;
  }
  if(!r.ok)say(j.error,'bad');
  else if(j.status==='review')say(t('Recorded. Your manager will check it because {r}.',{r:j.reasons.map(why).join(', ')}),'bad');
  else say(j.late>0?t('Recorded. You are {n} min late.',{n:j.late}):t('Recorded. Thank you!'),'ok');
  await load();
}
$('#undo').onclick=async()=>{
  if(!await ask(t('Undo clock-out?'),t('You will be clocked in again, as if you had not clocked out.'),t('Cancel'),t('Yes, undo')))return;
  const r=await api('/api/clock',{type:'undo'});
  if(!r.ok){say(r.j.error,'bad');return}
  say(t('Clock-out undone. You are clocked in again.'),'ok');await load();
};
