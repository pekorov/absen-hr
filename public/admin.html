<script>
const $=s=>document.querySelector(s),SS=sessionStorage;
let ME=null;
const can=a=>ME&&(ME.role==='owner'||(ME.role==='hr'&&a!=='admins')||(ME.role==='manager'&&a==='ops'));
async function api(p,o={}){
  const r=await fetch(p,{...o,headers:{'content-type':'application/json','x-admin':SS.getItem('tok')||''}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){signedOut('Your sign-in ended. Please sign in again.');throw Error('signed out')}
  return{ok:r.ok,j};
}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
const WHY={outside_office:'Outside the restaurant area',low_accuracy:'Low GPS accuracy',impossible_travel:'Impossible travel',no_location:'Location blocked',no_selfie:'No selfie',no_shift_today:'No shift scheduled',no_clock_out:'Missed clock-out',auto_clock_out:'Auto clock-out',no_qr:'QR code not scanned (beta)'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rpf=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const when=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const msgOk=t=>`<p class="good">${esc(t)}</p>`,msgErr=t=>`<div class="errs">${esc(t)}</div>`;
// PDF-START
const PDF_H=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PDF_B=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
async function pdfDeflate(u8){const cs=new CompressionStream('deflate'),w=cs.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
const pdfTxt=s=>String(s??'').replace(/[\u2013\u2014]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[^\x20-\xFF]/g,'?');
function pdfW(s,bold,size){const t=bold?PDF_B:PDF_H;let w=0;for(const ch of s){const c=ch.charCodeAt(0);w+=(c>=32&&c<=126?t[c-32]:556)}return w*size/1000}
const pdfEsc=s=>s.replace(/[\\()]/g,'\\$&');
function pdfWrap(s,bold,size,max){const out=[];let line='';for(const w of pdfTxt(s).split(' ')){const t=line?line+' '+w:w;if(pdfW(t,bold,size)>max&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out}
const pdfRp=n=>'Rp '+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
// d: {name,type,period,issued,earnings,deductions,net,att,ver}  logo: {w,h,gray} (grey levels, already on white)
async function makePdf(d,logo){
  const PW=595.28,PH=841.89,M=54,RX=PW-M,INK='0.169 0.165 0.141',GREY='0.482 0.463 0.4',LINE='0.894 0.863 0.796',MATCHA='0.306 0.42 0.227';
  let c='';const Y=y=>(PH-y).toFixed(2);
  const txt=(s,x,y,size,bold,align)=>{s=pdfTxt(s);if(align==='r')x-=pdfW(s,bold,size);c+=`BT /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(2)} ${Y(y)} Td (${pdfEsc(s)}) Tj ET\n`};
  const rule=(y,w)=>{c+=`${w} w ${M} ${Y(y)} m ${RX.toFixed(2)} ${Y(y)} l S\n`};
  const lh=logo?120*logo.h/logo.w:0;
  if(logo)c+=`q 120 0 0 ${lh.toFixed(2)} ${M} ${Y(48+lh)} cm /Im1 Do Q\n`;
  c+=`${GREY} rg\n`;txt('SLIP GAJI',RX,58,8,true,'r');
  c+=`${INK} rg\n`;txt(d.period,RX,78,15,true,'r');
  c+=`${INK} RG\n`;rule(108,1.6);
  const meta=[['Nama karyawan',d.name],['Jenis gaji',PTYPE_ID[d.type]||d.type],['Periode',d.period],['Tanggal terbit',d.issued]];
  meta.forEach(([l,v],i)=>{const x=i%2?310:M,y=132+Math.floor(i/2)*42;c+=`${GREY} rg\n`;txt(l,x,y,8,false);c+=`${INK} rg\n`;txt(v,x,y+16,11,true)});
  let y=232;
  const section=(title,rows,neg)=>{
    c+=`${GREY} rg\n`;txt(title.toUpperCase(),M,y,8,true);y+=8;
    if(!rows.length)rows=[{l:'Tidak ada',a:null}];
    for(const r of rows){
      c+=`${INK} rg\n`;txt(r.l,M,y+16,10.5,false);
      if(r.n){c+=`${GREY} rg\n`;txt(r.n,M,y+28,8.5,false)}
      c+=`${INK} rg\n`;txt(r.a==null?'-':(neg?'- ':'')+pdfRp(r.a),RX,y+16,10.5,false,'r');
      y+=r.n?38:28;c+=`${LINE} RG\n`;rule(y,0.5);
    }
    y+=16;
  };
  section('Pendapatan',d.earnings,false);section('Potongan',d.deductions,true);
  y+=4;c+=`${MATCHA} rg\n${M} ${Y(y+48)} ${(RX-M).toFixed(2)} 48 re f\n1 1 1 rg\n`;
  txt('GAJI BERSIH DITERIMA',M+18,y+29,9,true);txt(pdfRp(d.net),RX-18,y+32,19,true,'r');y+=48+22;
  c+=`${GREY} rg\n`;for(const ln of pdfWrap(d.att,false,8.5,RX-M)){txt(ln,M,y,8.5,false);y+=12}
  if(d.ver){y+=6;txt(d.ver,M,y,8.5,true)}
  const enc=s=>Uint8Array.from(s,ch=>ch.charCodeAt(0)&255);
  const parts=[],offs=[];let len=0;const push=u=>{parts.push(u);len+=u.length};
  const cat=(a,b)=>{const o=new Uint8Array(a.length+b.length);o.set(a);o.set(b,a.length);return o};
  const obj=(n,body)=>{offs[n]=len;push(enc(n+' 0 obj\n'));push(typeof body==='string'?enc(body):body);push(enc('\nendobj\n'))};
  const stream=(dict,bytes)=>cat(enc(`<< ${dict} /Length ${bytes.length} >>\nstream\n`),cat(bytes,enc('\nendstream')));
  push(enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >>${logo?' /XObject << /Im1 7 0 R >>':''} >> >>`);
  obj(4,stream('',enc(c)));
  obj(5,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(6,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  if(logo)obj(7,stream(`/Type /XObject /Subtype /Image /Width ${logo.w} /Height ${logo.h} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode`,await pdfDeflate(logo.gray)));
  const n=logo?8:7,xref=len;
  let x=`xref\n0 ${n}\n0000000000 65535 f \n`;for(let i=1;i<n;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(enc(x+`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));
  const out=new Uint8Array(len);let p=0;for(const u of parts){out.set(u,p);p+=u.length}return out;
}
// PDF-END

// ---------- payslips: viewer, PDF, WhatsApp ----------
const slipStore=new Map();
const sFmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
// The payslip itself (viewer and PDF) is in Indonesian.
const PTYPE_ID={monthly:'Bulanan',hourly:'Per jam',daily:'Harian'};
const idShort=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const idLong=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
function slipMeta(s){
  const period=s.from?`${idShort(s.from)} – ${idShort(s.to)} ${s.to.slice(0,4)}`:new Date(s.month+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  const att=`Masuk ${s.aDays} dari ${s.sDays} hari terjadwal`+(s.leaveDays?` | ${s.leaveDays} hari cuti tahunan (dibayar)`:'')+(s.lateDays?` | ${s.lateDays} kali terlambat`:'');
  return {period,att,issued:idLong(Date.now())};
}
const verLine=v=>v?`Diverifikasi oleh ${v.by} pada ${idLong(v.at)}`:'';
let logoCache;
async function getLogo(){
  if(logoCache)return logoCache;
  const img=new Image();img.src='/img/kurogi.png';await img.decode();
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');x.drawImage(img,0,0);const px=x.getImageData(0,0,c.width,c.height).data,g=new Uint8Array(c.width*c.height);
  for(let i=0;i<g.length;i++)g[i]=Math.round(255-px[i*4+3]*(255-43)/255);
  return logoCache={w:c.width,h:c.height,gray:g};
}
async function slipPdf(e){
  const s=e.s,m=slipMeta(s);
  const bytes=await makePdf({name:s.name,type:s.type,period:m.period,issued:m.issued,earnings:s.earnings,deductions:s.deductions,net:s.net,att:m.att,ver:verLine(s.ver)},await getLogo().catch(()=>null));
  return new File([bytes],`Slip_Gaji_${s.name.replace(/[^A-Za-z0-9]+/g,'_')}_${s.key||s.month}.pdf`,{type:'application/pdf'});
}
function openSlip(key){
  const e=slipStore.get(key);if(!e)return;const s=e.s,m=slipMeta(s),ok=s.state==='verified';
  const line=x=>`<div class="ps-row"><span>${esc(x.l)}${x.n?`<small>${esc(x.n)}</small>`:''}</span><span>${rpf(x.a)}</span></div>`;
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.pdf',{type:'application/pdf'})]}));

// ---------- Schedule ----------
function iso(v){if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);v=String(v).trim();let m=v.match(/^\d{4}-\d{2}-\d{2}/);if(m)return m[0];m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null}
let rows=[];
async function sch(){
  $('#v').innerHTML=`<div class="card"><h2>Import weekly schedule</h2><div class="sub">Excel (.xlsx) or CSV. Column A = Name, B = PIN (leave a PIN cell empty to keep that person's current PIN). Optional columns: "Phone" (WhatsApp number), "Login name" (what the person types to sign in), "Location" (a restaurant name from Setup, several names separated by a comma, or ALL). Then one column per date with a shift code (OFF for days off). See schedule-template.csv.</div><input type="file" id="f" accept=".xlsx,.xls,.csv"><div id="pv"></div></div><div class="card" id="lvc"></div>`;

    const f=e.target.files[0];if(!f)return;
    const cfg=(await api('/api/admin/config')).j,shifts=cfg.shifts||{},offs=cfg.offices||[];
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),g=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    const cols=[],errs=[];let lc=-1,gc=-1,pc=-1;

    (g[0]||[]).forEach((h,i)=>{if(i<2||String(h).trim()==='')return;const t=String(h).trim().toLowerCase();if(t==='location'||t==='lokasi'){lc=i;return}if(['login name','login','username','nama login'].includes(t)){gc=i;return}if(['phone','whatsapp','no hp','nomor hp','no. hp','hp','telepon','no wa','wa'].includes(t)){pc=i;return}const d=iso(h);if(d)cols.push({i,d});else errs.push(`Column ${i+1} header is not a date`)});
    rows=g.slice(1).filter(r=>String(r[0]).trim()).map(r=>{let pin=String(r[1]).trim();if(/^\d+$/.test(pin))pin=pin.padStart(4,'0');const days={};cols.forEach(c=>{const v=String(r[c.i]).trim().replace(/\s+/g,' ')||'OFF',k=v.toLowerCase();days[c.d]=k==='off'?'OFF':(byKey[k]||v)});const row={name:String(r[0]).trim(),pin,days};if(lc>=0)row.loc=String(r[lc]).trim();if(gc>=0)row.login=String(r[gc]).trim();if(pc>=0)row.phone=String(r[pc]).trim();return row});
    rows.forEach(r=>{Object.entries(r.days).forEach(([d,c])=>{if(c!=='OFF'&&!shifts[c])errs.push(`${r.name} on ${d}: unknown code "${c}"`)});if(r.loc!==undefined){const ps=splitLoc(r.loc),all=ps.length===1&&['all','semua'].includes(ps[0].toLowerCase()),bad=all?[]:ps.filter(p=>!offs.some(o=>o.id===slug(p)));if(bad.length)errs.push(`${r.name}: unknown location "${bad[0]}"`)}});
    const ds=cols.map(c=>c.d);
    $('#pv').innerHTML=`<p>Preview: ${rows.length} employees, ${ds.length} days</p>${errs.length?`<div class="errs">${errs.slice(0,12).map(esc).join('<br>')}<br>Fix the file and choose it again.</div>`:''}<div class="scroll"><table><tr><th>Name</th>${gc>=0?'<th>Login name</th>':''}${pc>=0?'<th>WhatsApp</th>':''}${lc>=0?'<th>Location</th>':''}${ds.map(d=>`<th>${d.slice(5)}</th>`).join('')}</tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td>${gc>=0?`<td>${esc(r.login||'')}</td>`:''}${pc>=0?`<td>${esc(r.phone||'')}</td>`:''}${lc>=0?`<td>${esc(r.loc||'ALL')}</td>`:''}${ds.map(d=>`<td>${esc(r.days[d])}</td>`).join('')}</tr>`).join('')}</table></div><div class="acts"><button class="btn p" id="imp" ${errs.length||!rows.length?'disabled':''}>Import</button></div><div id="res"></div>`;

  };

  <div class="grid2"><div><label class="f">Latitude</label><input data-i="${i}" data-f="lat" value="${esc(o.lat)}"></div><div><label class="f">Longitude</label><input data-i="${i}" data-f="lng" value="${esc(o.lng)}"></div></div>
  <label class="f">Allowed radius (metres)</label><input data-i="${i}" data-f="radius" value="${esc(o.radius??150)}">
  <label class="f">Counter QR code (beta)</label><select data-i="${i}" data-f="qr"><option value="off">Off</option><option value="test">Test: clock-in without QR goes to Review</option><option value="on">On: QR required to clock in</option></select>
  ${o.kkey&&o.qr!=='off'?`<div class="sub">Open this link on the counter tablet (keep it private):</div><div class="kl"><input readonly value="${esc(kioskUrl(o))}"><button class="btn s" data-cp="${i}">Copy</button></div><label class="sub" style="display:flex;align-items:center;margin-top:6px"><input type="checkbox" data-nk="${i}" ${o.newKey?'checked':''}>Make a new kiosk link when I save (the old link stops working)</label>`:''}
  <div class="acts"><button class="btn s" data-h="${i}">Use my current location</button><button class="btn no s" data-x="${i}">Remove</button></div></div>`).join('')||'<div class="sub">No locations yet.</div>';
  document.querySelectorAll('#ofs [data-f]').forEach(el=>{if(el.tagName==='SELECT')el.value=offs[el.dataset.i].qr||'off';el.oninput=el.onchange=()=>{offs[el.dataset.i][el.dataset.f]=el.value;if(el.dataset.f==='qr')drawOffs()}});
  document.querySelectorAll('[data-nk]').forEach(el=>el.onchange=()=>{offs[el.dataset.nk].newKey=el.checked});
  document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{const inp=b.previousElementSibling;try{await navigator.clipboard.writeText(inp.value);b.textContent='Copied'}catch(e){inp.select()}});
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{const o=offs[b.dataset.h];o.lat=p.coords.latitude;o.lng=p.coords.longitude;drawOffs()},()=>{$('#sm').innerHTML=msgErr('Location is blocked in this browser.')},{enableHighAccuracy:true}));
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{offs.splice(b.dataset.x,1);drawOffs()});
}
async function set(){
  const c=(await api('/api/admin/config')).j,sh=c.shifts||{M:{start:'07:00',end:'15:00'},Md:{start:'14:00',end:'22:00'},E:{start:'22:00',end:'06:00'}};
  offs=(c.offices||[]).map(o=>({...o,qr:o.qr||'off'}));
  $('#v').innerHTML=`<div class="grid2"><div class="card"><h2>Shift codes</h2><div class="sub">One per line: code,start,end. OFF is built in.</div><textarea id="sh" rows="8">${esc(Object.entries(sh).map(([k,v])=>`${k},${v.start},${v.end}`).join('\n'))}</textarea>
  <h3>Restaurant locations</h3><div class="sub">Stand inside each restaurant and press "Use my current location". Don't rename a location after assigning staff to it.</div><div id="ofs"></div>
  <div class="acts"><button class="btn" id="addo">+ Add location</button><button class="btn p" id="save">Save shift codes and locations</button></div><div id="sm"></div></div>
  <div><div class="card"><h2>Shift swap rules</h2><div class="sub">Employees can swap shifts with a colleague from the same restaurant. The colleague must accept first.</div>
  <label class="f" style="display:flex;align-items:center"><input type="checkbox" id="swa" ${c.swap.auto?'':'checked'}>A manager must approve swaps after both agree</label>
  <label class="f">Swaps close this many hours before the shift starts</label><input id="swh" inputmode="numeric" value="${c.swap.hours}">
  <div class="acts"><button class="btn p" id="sws">Save swap rules</button></div><div id="swm"></div></div>
  <div class="card" id="adc" hidden></div></div></div>
  <div class="card" id="emc"></div><div class="card" id="auc"></div>`;
  drawOffs();loadEmps();loadAudit();if(can('admins'))loadAdmins();
  $('#addo').onclick=()=>{offs.push({name:'',lat:'',lng:'',radius:150,qr:'off'});drawOffs()};
  $('#save').onclick=async()=>{
    const s=$('#sh').value.split('\n').map(l=>l.split(',').map(x=>x.trim())).filter(a=>a[0]).map(([code,start,end])=>({code,start,end}));
    const o=offs.filter(x=>String(x.name).trim()||String(x.lat).trim()).map(x=>({name:x.name,lat:parseFloat(x.lat),lng:parseFloat(x.lng),radius:parseInt(x.radius)||150,qr:x.qr||'off',newKey:!!x.newKey}));
    const{ok,j}=await post('/api/admin/config',{shifts:s,offices:o});
    if(!ok){$('#sm').innerHTML=msgErr(j.error);return}
    await set();$('#sm').innerHTML=msgOk('Saved.')+(j.warn&&j.warn.length?`<div class="why">${j.warn.map(esc).join('<br>')}</div>`:'');
  };
  $('#sws').onclick=async()=>{const{ok,j}=await post('/api/admin/config',{swap:{auto:!$('#swa').checked,hours:$('#swh').value}});$('#swm').innerHTML=ok?msgOk('Saved.'):msgErr(j.error)};
}
async function loadAdmins(msg){
  const{ok,j}=await api('/api/admin/admins');if(!ok)return;
  const box=$('#adc');box.hidden=false;
  box.innerHTML=`<h2>Admin accounts</h2><div class="sub">Give each HR person or manager their own login, so the activity log shows who did what. <b>HR</b> can do everything except manage admins. <b>Manager</b> can use Review, Today and Schedule only (no pay). You (owner) sign in with an empty username and the owner password.</div>
  <div class="scroll"><table style="min-width:360px"><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr>${j.list.map(a=>`<tr><td>${esc(a.name)}${a.off?' <span class="chip bad">disabled</span>':''}</td><td>${esc(a.user)}</td><td>${ROLE[a.role]}</td><td><button class="btn s" data-ae="${esc(a.user)}">Edit</button> <button class="btn no s" data-ar="${esc(a.user)}">Remove</button></td></tr>`).join('')||'<tr><td colspan="4" class="sub">No admin accounts yet.</td></tr>'}</table></div>
  <h3 id="aft">Add an admin</h3><div class="grid2"><div><label class="f">Name</label><input id="an"></div><div><label class="f">Username</label><input id="au" autocapitalize="none"></div>
  <div><label class="f">Role</label><select id="ar"><option value="hr">HR</option><option value="manager">Manager</option></select></div><div><label class="f">Password (at least 8 characters)</label><input id="ap" type="password" autocomplete="new-password"></div></div>
  <label class="f" style="display:flex;align-items:center"><input type="checkbox" id="ao">Disabled (cannot sign in)</label>
  <div class="acts"><button class="btn p" id="asv">Save admin</button></div><div id="amsg">${msg||''}</div>`;
  $('#asv').onclick=async()=>{const r=await post('/api/admin/admins',{action:'save',name:$('#an').value,user:$('#au').value,role:$('#ar').value,password:$('#ap').value,off:$('#ao').checked});loadAdmins(r.ok?msgOk('Saved.'):msgErr(r.j.error));loadAudit()};
  document.querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>{const a=j.list.find(x=>x.user===b.dataset.ae);$('#aft').textContent='Edit '+a.name+' (leave password empty to keep it)';$('#an').value=a.name;$('#au').value=a.user;$('#au').readOnly=true;$('#ar').value=a.role;$('#ao').checked=a.off;$('#ap').value='';$('#an').focus()});
  document.querySelectorAll('[data-ar]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove admin '+b.dataset.ar+'?'))return;const r=await post('/api/admin/admins',{action:'remove',user:b.dataset.ar});loadAdmins(r.ok?msgOk('Removed.'):msgErr(r.j.error));loadAudit()});
}
async function loadAudit(){
  const{ok,j}=await api('/api/admin/audit');if(!ok)return;
  $('#auc').innerHTML=`<h2>Activity log</h2><div class="sub">The last 200 changes and sign-ins, newest first. Failed sign-ins appear here too.</div>
  <div class="scroll" style="max-height:420px;overflow-y:auto"><table><tr><th>When</th><th>Who</th><th>What</th><th>Details</th></tr>${j.list.map(x=>`<tr><td>${when(x.at)}</td><td>${esc(x.by)}</td><td>${/Failed/.test(x.act)?`<span class="bad">${esc(x.act)}</span>`:esc(x.act)}</td><td style="white-space:normal;min-width:220px">${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="sub">Nothing yet.</td></tr>'}</table></div>`;
}
</script></body></html>
